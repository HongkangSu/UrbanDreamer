# Long Toy offline-pretrain / online-finetune profile (5 pretraining epochs).
# The filename is retained for compatibility with old commands; it does not collect250 episodes.
# Supply compatible offline archives before running.

[inputs]
network_name = "toy_cross_bottleneck"
network_dir = "../networks/toy_cross_bottleneck"

[run]
# Codec epochs are an upper bound; held-out quality gates decide readiness.
codec_pretraining_epochs = 10
output_dir = "../outputs/toy_urbandreamer_long_per_transition_pretrain_eventq_meso"
device = "cuda:1"
seed = 42
world_model_initialization_epochs = 5
online_training_episodes = 1000
evaluation_episodes = 3

[simulation]
# K=4 current-to-destination route actions at global 30-second boundaries.
routing_mode = "current_to_dest"
# Shared mainline/baseline mesoscopic execution profile.
traffic_model = "meso"
meso_junction_control = true
meso_lane_queue = false
meso_multi_queue = false
meso_edge_length_m = 98.0
meso_interpolate_positions = true
session_protocol = "event"
observation_step_seconds = 1.0
backend = "libsumo"
# Homogeneous Poisson arrivals per OD; counts in agents.csv define expected demand.
demand_duration_seconds = 420.0
vehicle_max_speed_mps = 40.0
world_model_intervals_per_episode = 60
episode_wall_timeout_seconds = 3600.0
training_completion_buffer_seconds = 3000
evaluation_horizon_seconds = 4800
incident_edge = "A_in"
incident_start_seconds = 100000.0
incident_end_seconds = 100001.0
incident_speed_mps = 0.1
sumo_extra_args = []

[resources]
# Finish whole imagination passes within the per-episode target when possible.
imagination_passes_per_episode = 2
imagination_time_budget_seconds = 60.0
world_model_imagination_precision = "fp16"
world_model_imagination_compile = true
world_model_imagination_compile_mode = "default"
world_model_imagination_space_chunk = 16
world_model_imagination_time_chunk = 32768
world_model_imagination_mlp_chunk = 16384
# Measured GPU pretraining preset; activation checkpointing bounds the working memory.
world_model_pretrain_space_chunk = 16
world_model_pretrain_time_chunk = 32768
world_model_pretrain_mlp_chunk = 16384
world_model_pretrain_activation_checkpointing = true
world_model_initialization_batch_size = 64
world_model_initialization_sequence_length = 3
world_model_gradient_accumulation_steps = 1
online_world_model_batch_size = 16

[data]
# Empty validation roots select disjoint held-out demand groups automatically.
validation_archive_roots = []
# Optional prepared caches; relative paths resolve from this TOML file.
# pretrain_cache_manifest = "../data/pretrain_cache/manifest.json"
# validation_cache_manifest = "../data/validation_cache/manifest.json"
# Required before mainline execution: matching Toy reference320/T420 real training archives.
archive_roots = []
cache_episodes = 2

[method]
# State-only background prior; FM retains action conditioning.
prior_filter = "soft"
prior_filter_strength = 0.1
prior_action_conditioned = false
prior_filter_input = false
prior_usage = "condition_only"
disagreement_samples = 2
disagreement_weight = 0.1
fm_solver = "euler"
fm_steps = 100
fm_training_mode = "recursive_3step"
actor_entropy_mode = "annealed"
actor_entropy_initial_coefficient = 0.002
actor_entropy_final_coefficient = 0.0001
actor_entropy_hold_fraction = 0.1
actor_entropy_end_fraction = 0.8
# Optional behavior prior, shared with learning baselines; set weight to 1 to enable.
sp_prior_weight = 0.0
sp_prior_temperature = 30.0
sp_prior_hold_episodes = 200
sp_prior_off_episode = 1000
# Independent-mode label scope; recursive supervision follows the sequence-start fleet.
transition_volume_scope = "previous_state_excluding_current_births"

[codec]
decoder_online_enabled = true
decoder_online_learning_rate = 0.00001
decoder_pretrain_enabled = true
decoder_pretrain_learning_rate = 1e-4
occupied_speed_weight = 1.0
slow_speed_weight = 1.0
slow_speed_mps = 2.0
slow_min_vehicles = 5.0
occupied_speed_mae_mps_max = 1.5
slow_speed_mae_mps_max = 0.5
slow_validation_min_roads = 0
# Freeze encoder after reconstruction; calibrate decoder during offline FM pretraining.
learning_rate = 1e-4
batch_size = 32
max_updates = 20000
validation_every = 500
occupied_vehicle_mae_max = 0.5
vehicle_mae_max = 0.1
empty_vehicle_mae_max = 0.05
total_relative_mae_max = 0.1
speed_mae_mps_max = 1.5
speed_positive = true
