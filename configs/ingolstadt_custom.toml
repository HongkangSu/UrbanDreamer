# Fresh end-to-end Ingolstadt reproduction for the retained UrbanDreamer
# mainline. The historical reference used a 50-episode replay and 8,000
# world-model pretraining microbatches; this run recreates that budget from
# the frozen inputs instead of loading a legacy world-model checkpoint.

[inputs]
network_name = "ingolstadt_custom"
network_dir = "../networks/ingolstadt_custom"
route_artifacts_dir = "../networks/ingolstadt_custom"
post_mutation_state = "../networks/ingolstadt_custom/post_mutation_state.json"
initial_hdv_state = "../networks/ingolstadt_custom/initial_hdv_state.json"
hdv_response_checkpoint = "../networks/ingolstadt_custom/hdv_response_predictor_v4.pt"

[run]
output_dir = "../outputs/ingolstadt_custom"
device = "cuda:0"
seed = 42
warmup_episodes = 50
# Historical budget: 8,000 microbatches, accumulated into 250 optimizer updates.
world_model_initialization_steps = 8000
online_training_episodes = 150
evaluation_episodes = 5

[simulation]
decision_intervals_per_episode = 60
warmup_horizon_seconds = 1800
# Random warmup routes can gridlock well beyond the trained-policy horizon.
# Preserve only complete replay episodes by allowing a 9,000-second total
# warmup horizon (1,800 decision seconds + 7,200 completion seconds).
warmup_completion_drain_seconds = 7200
warmup_completion_patience_seconds = 0
episode_wall_timeout_seconds = 3600.0
training_completion_buffer_seconds = 2000
evaluation_horizon_seconds = 3800
incident_edge = "201201950#0"
incident_start_seconds = 500.0
incident_end_seconds = 1500.0
incident_speed_mps = 1.0
sumo_extra_args = ["--collision.action", "warn"]

[resources]
world_model_initialization_batch_size = 1
world_model_initialization_sequence_length = 16
world_model_gradient_accumulation_steps = 32
online_world_model_batch_size = 4
