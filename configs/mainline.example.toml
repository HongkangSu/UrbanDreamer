[inputs]
# All relative paths are resolved from this TOML file. This example therefore
# expects one prepared bundle at <repository>/networks/example_network/.
network_name = "example_network"
network_dir = "../networks/example_network"

[run]
# Use a fresh directory, or one containing a matching checkpoints/latest.pt.
output_dir = "../outputs/example_network"
device = "cpu"
seed = 42
# These small counts form a smoke profile. Increase them for a full experiment.
warmup_episodes = 1
world_model_initialization_steps = 1
online_training_episodes = 1
evaluation_episodes = 1

[simulation]
vehicle_max_speed_mps = 40.0
# One world-model interval is fixed at 30 simulation seconds.
world_model_intervals_per_episode = 60
warmup_horizon_seconds = 1800
warmup_completion_drain_seconds = 3000
warmup_completion_patience_seconds = 0
episode_wall_timeout_seconds = 3600.0
training_completion_buffer_seconds = 2000
evaluation_horizon_seconds = 4800
# Replace this with an edge from edge_registry.json. To avoid an active
# incident, place the window after every configured episode horizon.
incident_edge = "replace_with_valid_edge_id"
incident_start_seconds = 100000.0
incident_end_seconds = 100001.0
incident_speed_mps = 1.0
sumo_extra_args = ["--collision.action", "warn"]

[resources]
world_model_initialization_batch_size = 1
world_model_initialization_sequence_length = 2
world_model_gradient_accumulation_steps = 1
online_world_model_batch_size = 4
