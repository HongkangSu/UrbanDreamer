# Full from-scratch mainline profile for Fontenay-en-Parisis.
# Relative paths are resolved from this file. Prepare the complete input
# bundle under <repository>/networks/fontenay_en_parisis/ before running.

[inputs]
network_name = "fontenay_en_parisis"
network_dir = "../networks/fontenay_en_parisis"

[run]
output_dir = "../outputs/fontenay_en_parisis"
device = "cuda:0"
seed = 42
# Collect 50 episodes, then traverse the replay for 5 shuffled epochs.
# Epoch budgets are explicit; they are not a conversion of historical step counts.
warmup_episodes = 50
world_model_initialization_epochs = 5
online_training_episodes = 150
evaluation_episodes = 5

[simulation]
# Homogeneous Poisson arrivals per OD; counts in agents.csv define expected demand.
demand_duration_seconds = 1800.0
vehicle_max_speed_mps = 40.0
world_model_intervals_per_episode = 60
warmup_horizon_seconds = 1800
# Strong multi-edge congestion can drain slowly; incomplete warmup episodes
# are retried, so retain a conservative completion window.
warmup_completion_drain_seconds = 7200
warmup_completion_patience_seconds = 0
episode_wall_timeout_seconds = 3600.0
training_completion_buffer_seconds = 2000
evaluation_horizon_seconds = 3800
# A comma-separated value applies the same incident to every listed edge.
incident_edge = "101220399#0,101220399#1,23214994,-494202201#0,-494202201#1,494202201#0,494202201#1"
incident_start_seconds = 300.0
incident_end_seconds = 1800.0
incident_speed_mps = 0.1
sumo_extra_args = [
  "--collision.action",
  "warn",
  "--ignore-junction-blocker",
  "60",
  "--tripinfo-output.write-unfinished",
]

[resources]
world_model_initialization_batch_size = 1
world_model_initialization_sequence_length = 16
world_model_gradient_accumulation_steps = 32
online_world_model_batch_size = 4
